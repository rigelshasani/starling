; Starling: a pocket virtual pet for the Waveshare ESP32-S3-Touch-LCD-3.49.
;
;   pio run -e lcd349_rev2 -t upload     flash a Rev2 board (default)
;   pio run -e lcd349_rev1 -t upload     flash a Rev1 board
;   pio run -e sim && .pio/build/sim/program screenshots   render every scene to PNGs
;   pio test -e native                   game-rule unit tests on this computer

[platformio]
default_envs = lcd349_rev2

[device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-r8-opi
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9-libs.tar.xz
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#dd977b70828545c23d2b73140ac02d716a11bdd3
monitor_speed = 115200
build_src_filter = +<*> -<sim/>
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
  -std=gnu++20
  -DCORE_DEBUG_LEVEL=2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESP32QSPI_MAX_PIXELS_AT_ONCE=2048

[env:lcd349_rev2]
extends = device
build_flags =
  ${device.build_flags}
  -DSTARLING_BOARD_REV=2

[env:lcd349_rev1]
extends = device
build_flags =
  ${device.build_flags}
  -DSTARLING_BOARD_REV=1
  -DESP32QSPI_SPI_HOST=SPI3_HOST

[env:sim]
platform = native
build_src_filter = +<gfx/> +<game/> +<ui/> +<sim/>
build_flags = -std=c++20 -O2 -Isrc -lz

[env:native]
platform = native
build_src_filter = +<game/>
build_flags = -std=c++20 -Isrc
test_build_src = yes
